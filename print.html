<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MAJ Travel – Print Itinerary</title>
    <link rel="stylesheet" href="style.css">
    <script src="print.js" defer></script>
</head>
<body>
<header class="main-header print-header">
    <img src="img/Logo 01.jpg" alt="MAJ Travel Logo" class="maj-logo">
    <h1>Print Itinerary</h1>
</header>
 
<main class="content print-content">
    <section>
        <h2 id="printTripName"></h2>
        <p><strong>Start date:</strong> <span id="printTripStart"></span></p>
    </section>

    <section id="printDaysContainer"></section>

    <button onclick="window.print()">Print</button>
    <button onclick="window.location.href='itinerary.html'">Back to Builder</button>
</main>

<footer class="main-footer">
    <p>© MAJ Travel</p>
</footer>
</body>
</html>
