<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MAJ Travel – Build Your Itinerary</title>
<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>

<body>

<header class="header">
    <h1>MAJ Travel – Itinerary Builder</h1>
</header>

<div id="controls">
    <input id="stopInput" placeholder="Enter destination">
    <select id="daySelect">
        <option value="day1">Day 1</option>
        <option value="day2">Day 2</option>
        <option value="day3">Day 3</option>
        <option value="day4">Day 4</option>
        <option value="day5">Day 5</option>
        <option value="day6">Day 6</option>
        <option value="day7">Day 7</option>
    </select>
    <button onclick="addStop()">Add Stop</button>
</div>

<div id="board">
    <div class="dayColumn"><h2>Day 1</h2><ul id="day1List" class="sortable"></ul></div>
    <div class="dayColumn"><h2>Day 2</h2><ul id="day2List" class="sortable"></ul></div>
    <div class="dayColumn"><h2>Day 3</h2><ul id="day3List" class="sortable"></ul></div>
    <div class="dayColumn"><h2>Day 4</h2><ul id="day4List" class="sortable"></ul></div>
    <div class="dayColumn"><h2>Day 5</h2><ul id="day5List" class="sortable"></ul></div>
    <div class="dayColumn"><h2>Day 6</h2><ul id="day6List" class="sortable"></ul></div>
    <div class="dayColumn"><h2>Day 7</h2><ul id="day7List" class="sortable"></ul></div>
</div>

<div id="map"></div>

<!-- ⭐ Directions BELOW the map -->
<div id="directionsArea">
    <h2>Route Directions</h2>
    <div id="directionsContent"></div>
</div>

<div id="bottomButtons">
    <button onclick="downloadItinerary()">Download Itinerary</button>
    <button onclick="clearAll()">Clear All</button>
    <button onclick="resetMap()">Reset Map</button>
</div>

<script src="travel-time.js"></script>
<script src="maps.js"></script>
<script src="script.js"></script>

</body>
</html>
