<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerary Builder – MAJ Travel</title>
    <link rel="stylesheet" href="style.css">
 
    <style>
        li {
            padding: 8px;
            margin: 4px 0;
            background: #f7f7f7;
            border-radius: 5px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        li:active {
            cursor: grabbing;
        }

        .drag-handle {
            font-weight: bold;
            cursor: grab;
            user-select: none;
        }

        li.dragging {
            opacity: 0.5;
            background: #e0e0e0;
        }

        .delete-btn {
            margin-left: auto;
            color: #b30000;
            cursor: pointer;
            font-weight: bold;
            padding: 4px;
        }

        .delete-btn:hover {
            color: #ff0000;
        }
    </style>
</head>
<body>
 
    <header class="small-hero">
        <h2>Itinerary Builder</h2>
        <p>Create your custom travel plan step by step.</p>
    </header>

    <section class="destination-info">

        <h3>Select Day</h3>
        <select id="daySelect" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;">
            <option value="day1">Day 1</option>
            <option value="day2">Day 2</option>
            <option value="day3">Day 3</option>
        </select>

        <h3 style="margin-top:20px;">Select Time</h3>
        <input id="timeInput" type="time" 
               style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;">

        <h3 style="margin-top:20px;">Add a Stop</h3>
        <input id="stopInput" type="text" placeholder="Enter a location or activity" 
               style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;">

        <button onclick="addStop()" 
                style="margin-top:10px; padding:10px 20px; background:#d4af37; border:none; color:white; border-radius:5px; cursor:pointer;">
            Add to Itinerary
        </button>

        <h3 style="margin-top:30px;">Your Itinerary</h3>

        <h4>Day 1</h4>
        <ul id="day1List" class="sortable" style="padding-left:20px;"></ul>

        <h4>Day 2</h4>
        <ul id="day2List" class="sortable" style="padding-left:20px;"></ul>

        <h4>Day 3</h4>
        <ul id="day3List" class="sortable" style="padding-left:20px;"></ul>

        <a class="back-btn" href="index.html">← Back to Home</a>
    </section>

    <script>
        function saveItinerary() {
            const data = {
                day1: getListData("day1List"),
                day2: getListData("day2List"),
                day3: getListData("day3List")
            };
            localStorage.setItem("itineraryData", JSON.stringify(data));
        }

        function getListData(listId) {
            const items = document.querySelectorAll(`#${listId} li`);
            return Array.from(items).map(li => {
                return {
                    text: li.querySelector("span:nth-child(2)").textContent
                };
            });
        }

        function loadItinerary() {
            const saved = localStorage.getItem("itineraryData");
            if (!saved) return;

            const data = JSON.parse(saved);

            ["day1", "day2", "day3"].forEach(day => {
                const list = document.getElementById(day + "List");
                list.innerHTML = "";
                data[day].forEach(item => addLoadedStop(day, item.text));
            });
        }

        function addLoadedStop(day, text) {
            const li = document.createElement("li");

            const handle = document.createElement("span");
            handle.className = "drag-handle";
            handle.textContent = "⋮⋮";

            const textSpan = document.createElement("span");
            textSpan.textContent = text;

            const del = document.createElement("span");
            del.className = "delete-btn";
            del.textContent = "❌";
            del.onclick = () => { li.remove(); saveItinerary(); };

            li.appendChild(handle);
            li.appendChild(textSpan);
            li.appendChild(del);

            li.draggable = true;
            li.addEventListener("dragstart", dragStart);
            li.addEventListener("dragend", dragEnd);
            li.addEventListener("dragover", dragOver);
            li.addEventListener("drop", dropItem);

            document.getElementById(day + "List").appendChild(li);
        }

        function addStop() {
            const input = document.getElementById("stopInput");
            const time = document.getElementById("timeInput").value;
            const day = document.getElementById("daySelect").value;

            if (input.value.trim() !== "") {
                const li = document.createElement("li");

                const handle = document.createElement("span");
                handle.className = "drag-handle";
                handle.textContent = "⋮⋮";

                const text = document.createElement("span");
                text.textContent = (time ? time + " — " : "") + input.value;

                const del = document.createElement("span");
                del.className = "delete-btn";
                del.textContent = "❌";
                del.onclick = () => { li.remove(); saveItinerary(); };

                li.appendChild(handle);
                li.appendChild(text);
                li.appendChild(del);

                li.draggable = true;
                li.addEventListener("dragstart", dragStart);
                li.addEventListener("dragend", dragEnd);
                li.addEventListener("dragover", dragOver);
                li.addEventListener("drop", dropItem);

                document.getElementById(day + "List").appendChild(li);

                input.value = "";
                document.getElementById("timeInput").value = "";

                saveItinerary();
            }
        }

        let draggedItem = null;

        function dragStart(e) {
            draggedItem = e.target;
            e.target.classList.add("dragging");
        }

        function dragEnd(e) {
            e.target.classList.remove("dragging");
            saveItinerary();
        }

        function dragOver(e) {
            e.preventDefault();
        }

        function dropItem(e) {
            e.preventDefault();
            const list = e.target.closest("ul");

            if (draggedItem && list && draggedItem !== e.target) {
                list.insertBefore(draggedItem, e.target.nextSibling);
                saveItinerary();
            }
        }

        loadItinerary();
    </script>

</body>
</html>
