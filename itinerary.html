<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MAJ Travel – Build Your Itinerary</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="maps.js" defer></script>
</head>
<body>
<header class="main-header">
    <img src="img/Logo 01.jpg" alt="MAJ Travel Logo" class="maj-logo">
    <h1>Build Your Itinerary</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="itinerary.html">Build Your Itinerary</a>
        <a href="about.html">About</a>
        <a href="print.html">Print View</a>
    </nav>
</header>
 
<main class="content">
    <section class="itinerary-builder">
        <h2>Trip Details</h2>
        <label>
            Trip name:
            <input type="text" id="tripName">
        </label>
        <label>
            Start date:
            <input type="date" id="tripStart">
        </label>

        <h2>Days</h2>
        <button id="addDayBtn">Add Day</button>
        <div id="daysContainer"></div>

        <button id="saveItineraryBtn">Save Itinerary</button>
        <button id="goToPrintBtn" onclick="window.location.href='print.html'">Go to Print View</button>
    </section>
</main>

<footer class="main-footer">
    <p>© MAJ Travel</p>
</footer>
</body>
</html>
